# Generated by the QA Intelligence Platform. Manual edits are overwritten on the
# next sync. Job names map onto test stages and must not be renamed.
name: QA Test Stages
run-name: QA Test Stages · ${{ inputs.stages }} · ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Correlation id issued by the QA platform
        required: true
      project_key:
        description: QA project key these tests belong to
        required: true
      stages:
        description: Comma-separated stages to run, in pipeline order
        required: true

permissions:
  contents: read

env:
  QA_SCRIPT_DIR: tests/automation

jobs:
  smoke:
    name: Smoke
    if: contains(inputs.stages, 'SMOKE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/automation/requirements.txt
          if python -c "import playwright" 2>/dev/null; then
            python -m playwright install --with-deps chromium
          fi

      - name: Run smoke tests
        continue-on-error: true
        run: |
          # A stage folder that does not exist, or holds no file pytest would
          # collect, is not a failure: nothing is classified into this stage yet.
          # Every stage job runs so that every folder under the test directory is
          # looked at; without this guard the empty ones exit 4 ("file or directory
          # not found") or 5 ("no tests collected") and go red.
          dir="tests/automation/smoke"
          if [ ! -d "$dir" ]; then
            echo "No $dir directory — nothing classified into this stage."
            exit 0
          fi
          if ! compgen -G "$dir/test_*.py" > /dev/null && \
             ! compgen -G "$dir/*_test.py" > /dev/null; then
            echo "No test files in $dir — nothing classified into this stage."
            exit 0
          fi
          pytest "$dir" \
            --junitxml=junit-smoke.xml \
            -o junit_family=xunit2 -v

      - name: Evaluate smoke quality gate
        env:
          QA_STAGE: SMOKE
        run: |
          python - <<'PY'
          import json, os, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          stage = os.environ["QA_STAGE"]
          report = Path(f"junit-{stage.lower()}.xml")

          manifest = json.loads(
              Path(os.environ["QA_SCRIPT_DIR"], "manifest.json").read_text(encoding="utf-8")
          )
          expected = [
              case
              for entry in manifest["stages"] if entry["stage"] == stage
              for case in entry["test_cases"]
          ]

          if not expected:
              # Nothing is classified into this stage. The job ran so that every
              # stage folder is looked at, and passes because there was nothing to
              # run — not because something ran and succeeded.
              print(f"{stage}: nothing classified into this stage")
              sys.exit(0)

          if not report.exists():
              print(f"::error::{stage}: no JUnit report was produced")
              sys.exit(1)
          critical_cases = [c for c in expected if c.get("is_critical")]

          root = ET.parse(report).getroot()
          collected = len(list(root.iter("testcase")))
          if expected and not collected:
              # A stage that ran nothing must not report success. pytest exits 5 and
              # writes an empty report when it collects no tests — a file whose name
              # does not match test_*.py is the usual cause — and without this check
              # the gate passed, the pipeline went green, and nothing had been tested.
              print(
                  f"::error::{stage}: the manifest lists {len(expected)} test case(s) "
                  f"but pytest collected none. Check that the synced files under "
                  f"{os.environ['QA_SCRIPT_DIR']}/{stage.lower()}/ are named test_*.py "
                  f"and contain test_* functions."
              )
              sys.exit(1)

          failed = []
          for case in root.iter("testcase"):
              if case.find("failure") is None and case.find("error") is None:
                  continue
              node = f"{case.get('classname', '')}.{case.get('name', '')}.{case.get('file', '')}"
              for cc in critical_cases:
                  tc_id = str(cc.get("test_case_id") or "")
                  script_p = str(cc.get("script_path") or "")
                  stem = Path(script_p).stem if script_p else ""
                  if (tc_id and tc_id in node) or (stem and stem in node):
                      failed.append(tc_id or stem)

          if failed:
              print(f"::error::{stage} gate failed. Critical: {sorted(set(failed))}")
              sys.exit(1)
          print(f"{stage} gate passed ({collected} test case(s) ran)")
          PY

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-smoke
          path: junit-smoke.xml
          if-no-files-found: warn


